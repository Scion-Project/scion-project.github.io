<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Scion</title>
  <desc id="d">Apple's open-source XNU kernel on Android phones. iOS 16.5 and iOS 27 on the Galaxy S9; S9+, Pixel 10.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1116"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2fbf71" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2fbf71" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf71"/>
      <stop offset="1" stop-color="#9be15d"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf71"/>
      <stop offset="1" stop-color="#9be15d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- left: words -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(110 150)">
      <rect width="76" height="76" rx="18" fill="#141a21" stroke="#26303b"/>
      <g transform="translate(38 38) scale(0.13) translate(-256 -256)">
        <rect x="156" y="300" width="200" height="120" rx="22" fill="none" stroke="#5b6b82" stroke-width="14"/>
        <g stroke="#5b6b82" stroke-width="12" stroke-linecap="round">
          <line x1="196" y1="420" x2="196" y2="452"/><line x1="236" y1="420" x2="236" y2="452"/>
          <line x1="276" y1="420" x2="276" y2="452"/><line x1="316" y1="420" x2="316" y2="452"/>
        </g>
        <rect x="236" y="268" width="40" height="40" rx="8" fill="#9be15d"/>
        <path d="M256 280 C256 230 252 190 256 150" fill="none" stroke="url(#leaf)" stroke-width="18" stroke-linecap="round"/>
        <path d="M256 196 C206 196 160 166 150 106 C206 104 248 134 256 196 Z" fill="url(#leaf)"/>
        <path d="M258 160 C300 150 340 112 352 60 C300 62 262 100 258 160 Z" fill="url(#leaf)"/>
      </g>
      <text x="100" y="52" font-size="46" font-weight="700" fill="#e6ebf1">Scion</text>
    </g>
    <text x="110" y="355" font-size="64" font-weight="800" fill="#e6ebf1" letter-spacing="-2">Apple's open-source kernel,</text>
    <text x="110" y="435" font-size="64" font-weight="800" fill="url(#word)" letter-spacing="-2">on Android phones.</text>
    <text x="112" y="515" font-size="30" fill="#b9c3cf">iOS 16.5 and iOS 27 on the Galaxy S9, from one kernel tree.</text>
    <text x="112" y="559" font-size="30" fill="#b9c3cf">Our own drivers. Nothing of Apple's in the repositories.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">
      <text x="112" y="800" fill="#e6ebf1">Galaxy S9 <tspan fill="#5b6b82">·</tspan> <tspan fill="#a3afbd">S9+</tspan> <tspan fill="#5b6b82">·</tspan> <tspan fill="#a3afbd">Pixel 10</tspan></text>
      <text x="112" y="840" fill="#7d8896">scion-project.github.io</text>
    </g>
  </g>

  <!-- right: one tree, two releases, two phones -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <!-- trunk -->
    <rect x="1080" y="620" width="300" height="84" rx="16" fill="#141a21" stroke="#2fbf71" stroke-width="2"/>
    <text x="1230" y="656" text-anchor="middle" fill="#e6ebf1" font-weight="700">scion-kernel</text>
    <text x="1230" y="686" text-anchor="middle" fill="#a3afbd" font-size="18">one tree, shared drivers</text>
    <!-- branches -->
    <path d="M1180 620 C1180 560 1090 560 1090 500" fill="none" stroke="url(#leaf)" stroke-width="5" stroke-linecap="round"/>
    <path d="M1280 620 C1280 560 1370 560 1370 500" fill="none" stroke="url(#leaf)" stroke-width="5" stroke-linecap="round"/>
    <rect x="975" y="420" width="230" height="80" rx="14" fill="#141a21" stroke="#26303b" stroke-width="2"/>
    <text x="1090" y="454" text-anchor="middle" fill="#e6ebf1" font-weight="700">xnu-8796</text>
    <text x="1090" y="482" text-anchor="middle" fill="#9be15d" font-size="18">iOS 16.5</text>
    <rect x="1255" y="420" width="230" height="80" rx="14" fill="#141a21" stroke="#26303b" stroke-width="2"/>
    <text x="1370" y="454" text-anchor="middle" fill="#e6ebf1" font-weight="700">xnu-12377</text>
    <text x="1370" y="482" text-anchor="middle" fill="#9be15d" font-size="18">iOS 27</text>
    <!-- leaves: phones -->
    <path d="M1090 420 L1090 360" stroke="#3a4656" stroke-width="3"/>
    <path d="M1335 420 C1335 390 1290 390 1290 360" fill="none" stroke="#3a4656" stroke-width="3"/>
    <path d="M1405 420 C1405 390 1450 390 1450 360" fill="none" stroke="#3a4656" stroke-width="3"/>
    <text x="1090" y="345" text-anchor="middle" fill="#c9d2dc" font-size="19">S9 · S9+</text>
    <text x="1290" y="345" text-anchor="middle" fill="#c9d2dc" font-size="19">S9</text>
    <text x="1450" y="345" text-anchor="middle" fill="#c9d2dc" font-size="19">Pixel 10</text>
    <text x="1450" y="320" text-anchor="middle" fill="#7d8896" font-size="15">QEMU so far</text>
    <!-- roots: the phone underneath -->
    <g stroke="#3a4656" stroke-width="3" stroke-linecap="round">
      <line x1="1150" y1="704" x2="1150" y2="740"/><line x1="1200" y1="704" x2="1200" y2="740"/>
      <line x1="1260" y1="704" x2="1260" y2="740"/><line x1="1310" y1="704" x2="1310" y2="740"/>
    </g>
    <text x="1230" y="780" text-anchor="middle" fill="#7d8896" font-size="18">the phone's own hardware</text>
  </g>
</svg>
