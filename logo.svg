<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14181f"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf71"/>
      <stop offset="1" stop-color="#9be15d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- rootstock: a chip -->
  <rect x="156" y="300" width="200" height="120" rx="22" fill="none" stroke="#5b6b82" stroke-width="14"/>
  <g stroke="#5b6b82" stroke-width="12" stroke-linecap="round">
    <line x1="196" y1="420" x2="196" y2="452"/><line x1="236" y1="420" x2="236" y2="452"/>
    <line x1="276" y1="420" x2="276" y2="452"/><line x1="316" y1="420" x2="316" y2="452"/>
    <line x1="124" y1="340" x2="156" y2="340"/><line x1="124" y1="380" x2="156" y2="380"/>
    <line x1="356" y1="340" x2="388" y2="340"/><line x1="356" y1="380" x2="388" y2="380"/>
  </g>
  <!-- graft union -->
  <rect x="236" y="268" width="40" height="40" rx="8" fill="#9be15d"/>
  <!-- scion: stem and two leaves -->
  <path d="M256 280 C256 230 252 190 256 150" fill="none" stroke="url(#leaf)" stroke-width="18" stroke-linecap="round"/>
  <path d="M256 196 C206 196 160 166 150 106 C206 104 248 134 256 196 Z" fill="url(#leaf)"/>
  <path d="M258 160 C300 150 340 112 352 60 C300 62 262 100 258 160 Z" fill="url(#leaf)"/>
